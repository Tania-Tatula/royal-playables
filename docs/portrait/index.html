<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restore the Royal Portrait</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><main>
<h1>Restore the Royal Portrait</h1>
<div class="stage portrait">
<div class="field" aria-label="Three by three sliding puzzle"><img class="reward" src="../assets/wink.webp" alt="The king winks" hidden style="width:100%;height:100%"></div>
<div class="sheet" id="intro"><div class="card"><h2>The Royal Portrait</h2><p>Slide the tiles into the empty space to put the king’s portrait back together.</p><button class="primary" id="start">Play</button></div></div>
<div class="sheet" id="win" hidden><div class="card"><h2>Magnificent!</h2><p>The royal portrait is restored.</p><button class="primary" id="again">Play again</button></div></div>
</div>
<p class="status" aria-live="polite"></p><button class="reset" id="reset" hidden>Restart</button>
</main><script src="../assets/game.js"></script></body>
</html>
